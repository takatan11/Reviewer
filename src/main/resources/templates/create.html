<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規授業登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Noto Sans JP', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4 flex justify-center">

<div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">
        <span class="text-blue-600">New</span> Course Registration
    </h1>

    <!-- フォーム開始 -->
    <form th:action="@{/course/new}" method="post" th:object="${courseForm}" class="space-y-6">

        <!-- 授業名 -->
        <div>
            <label class="block text-gray-700 font-bold mb-2">授業名 <span class="text-red-500">*</span></label>
            <input type="text" th:field="*{className}" placeholder="例：線形代数"
                   class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none transition">
            <!-- エラー表示 -->
            <p th:if="${#fields.hasErrors('className')}" th:errors="*{className}" class="text-red-500 text-sm mt-1"></p>
        </div>

        <!-- 先生名 -->
        <div>
            <label class="block text-gray-700 font-bold mb-2">先生の名前 <span class="text-red-500">*</span></label>
            <input type="text" th:field="*{teacher}" placeholder="例：田中"
                   class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none transition">
            <p th:if="${#fields.hasErrors('teacher')}" th:errors="*{teacher}" class="text-red-500 text-sm mt-1"></p>
        </div>

        <!-- 学部・曜日（横並び） -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 学部 -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">学部 <span class="text-red-500">*</span></label>
                <select th:field="*{faculty}" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none bg-white cursor-pointer">
                    <!-- ★重要: .name()を使う！ -->
                    <option th:each="item : ${faculties}" th:value="${item.name()}" th:text="${item.displayName}"></option>
                </select>
            </div>

            <!-- 曜日 -->
            <div>
                <label class="block text-gray-700 font-bold mb-2">曜日 <span class="text-red-500">*</span></label>
                <select th:field="*{dayOfClass}" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none bg-white cursor-pointer">
                    <option value="">選択してください</option>
                    <option th:each="item : ${daysOfClass}" th:value="${item.name()}" th:text="${item.displayName}"></option>
                </select>
            </div>
        </div>

        <!-- 概要 -->
        <div>
            <label class="block text-gray-700 font-bold mb-2">概要</label>
            <textarea th:field="*{description}" rows="4" placeholder="授業の内容や特徴を入力してください"
                      class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none transition"></textarea>
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-500 text-sm mt-1"></p>
        </div>

        <!-- ボタンエリア -->
        <div class="flex justify-between items-center pt-4 mt-6 border-t">
            <a th:href="@{/}" class="text-gray-500 hover:text-gray-800 font-medium transition">キャンセル</a>
            <button type="submit" class="bg-blue-600 text-white font-bold py-3 px-10 rounded-full shadow-md hover:bg-blue-700 hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200">
                登録する
            </button>
        </div>
    </form>
</div>

</body>
</html>
