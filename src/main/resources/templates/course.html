<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>授業詳細</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        /* star rating */
        .rating { display: flex; flex-direction: row-reverse; gap: 6px; }
        .rating input { display: none; }
        .rating label { cursor: pointer; }
        .rating label svg { color: #d1d5db; transition: color 0.15s ease; }
        .rating label.active svg { color: #fbbf24; }
        .rating label:hover svg,
        .rating label:hover ~ label svg { color: #fcd34d; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <a th:href="@{/}" class="text-sm text-blue-600 hover:text-blue-700 font-semibold">&larr; 一覧に戻る</a>
        <h1 class="text-3xl font-bold text-gray-800" th:text="${course.className}">授業名</h1>
    </div>

    <div class="bg-white shadow-sm border border-gray-100 rounded-2xl p-6 mb-10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <p class="text-xs text-gray-500 font-semibold mb-1">学部</p>
                <p class="text-lg font-bold text-gray-800" th:text="${course.faculty.displayName}">学部</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-semibold mb-1">先生</p>
                <p class="text-lg font-semibold text-gray-800" th:text="${course.teacher}">担当教員</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-semibold mb-1">曜日</p>
                <p class="inline-flex items-center px-3 py-1 rounded-full bg-blue-50 text-blue-700 font-semibold" th:text="${course.dayOfClass.displayName}">授業の曜日</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-semibold mb-1">概要</p>
                <p class="text-gray-700 leading-relaxed" th:text="${course.description}">授業の概要</p>
            </div>
        </div>
    </div>

    <div class="bg-white shadow-sm border border-gray-100 rounded-2xl p-6 mb-10">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <svg class="w-6 h-6 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <div>
                        <p class="text-sm text-gray-500">平均スコア</p>
                        <p class="text-2xl font-bold text-gray-800" th:text="${#numbers.formatDecimal(averageScore, 1, 1)}">0.0</p>
                    </div>
                </div>
                <span class="text-sm text-gray-500">(<span th:text="${reviewCount}">0</span> 件)</span>
            </div>
            <div class="text-sm text-gray-500">最新の投稿から順に表示します</div>
        </div>
        <div th:if="${reviews.isEmpty()}" class="text-gray-400 text-sm">まだコメントはありません。</div>
        <div th:each="review : ${reviews}" class="border-b border-gray-100 py-4 last:border-b-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-bold text-gray-800" th:text="${review.reviewer}">投稿者</span>
                    <span class="text-xs text-gray-400" th:text="${review.createdAt}">投稿日</span>
                </div>
                <span class="inline-flex items-center px-2 py-1 rounded bg-yellow-100 text-yellow-800 text-sm font-semibold">★<span th:text="${review.score}" class="ml-1">5</span></span>
            </div>
            <p class="mt-2 text-gray-700 leading-relaxed" th:text="${review.comment}">コメント内容</p>
        </div>
    </div>

    <div class="bg-white shadow-sm border border-gray-100 rounded-2xl p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">コメントを投稿する</h2>
        <form th:action="@{/course/{id}/review(id=${course.id})}" method="post" th:object="${reviewForm}" class="space-y-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <label for="reviewer" class="block text-sm font-semibold text-gray-700 mb-1">名前</label>
                <input type="text" id="reviewer" th:field="*{reviewer}" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="お名前" />
                <p th:if="${#fields.hasErrors('reviewer')}" th:errors="*{reviewer}" class="text-red-500 text-sm mt-1"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">スコア (1-5)</label>
                    <div class="rating">
                        <th:block th:each="i : ${#numbers.sequence(5,1)}">
                            <input type="radio" th:id="${'star' + i}" th:field="*{score}" th:value="${i}" />
                            <label th:for="${'star' + i}" aria-label="star" class="inline-flex">
                                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                            </label>
                        </th:block>
                    </div>
                    <p th:if="${#fields.hasErrors('score')}" th:errors="*{score}" class="text-red-500 text-sm mt-1"></p>
                </div>
            </div>
            <div>
                <label for="comment" class="block text-sm font-semibold text-gray-700 mb-1">コメント</label>
                <textarea id="comment" th:field="*{comment}" rows="4" required
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="授業の感想やおすすめポイント"></textarea>
                <p th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="text-red-500 text-sm mt-1"></p>
            </div>
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition">
                    投稿する
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // 星を選択したときに1から選択値までを点灯させる
    (function() {
        const rating = document.querySelector('.rating');
        if (!rating) return;
        const inputs = Array.from(rating.querySelectorAll('input[type="radio"]'));
        const labels = Array.from(rating.querySelectorAll('label'));

        function syncStars(value) {
            const target = Number(value);
            labels.forEach(label => {
                const forId = label.getAttribute('for');
                const input = inputs.find(i => i.id === forId);
                const val = Number(input?.value || 0);
                label.classList.toggle('active', val <= target);
            });
        }

        inputs.forEach(input => {
            input.addEventListener('change', e => syncStars(e.target.value));
        });

        const checked = inputs.find(i => i.checked);
        if (checked) {
            syncStars(checked.value);
        }
    })();
</script>
</body>
</html>
